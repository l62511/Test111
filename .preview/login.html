<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 退款审批后台</title>
  <style>
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --line: #e5e7eb;
  --line-soft: #f0f1f3;
  --text: #1f2328;
  --text-2: #656d76;
  --text-3: #8b949e;
  --accent: #2563eb;
  --accent-soft: #eff4ff;
  --ok: #15803d;
  --ok-soft: #eaf6ef;
  --warn: #b45309;
  --warn-soft: #fdf4e7;
  --err: #b91c1c;
  --err-soft: #fdecec;
  --radius: 10px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
               "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.shell { max-width: 1120px; margin: 0 auto; padding: 20px 24px 64px; }

/* ---------- 顶栏 ---------- */
.topbar {
  display: flex; align-items: center; gap: 28px;
  padding: 14px 20px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius);
  margin-bottom: 16px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.logo {
  width: 30px; height: 30px; border-radius: 8px; flex: none;
  background: linear-gradient(135deg, #2563eb, #4f46e5);
  position: relative;
}
.logo::after {
  content: ""; position: absolute; inset: 9px;
  border: 2px solid #fff; border-radius: 3px; border-top-color: transparent;
}
.brand-name { font-weight: 600; font-size: 14px; line-height: 1.3; }
.brand-sub { font-size: 12px; color: var(--text-3); line-height: 1.3; }

.nav { display: flex; gap: 4px; margin-left: 12px; }
.nav a {
  color: var(--text-2); text-decoration: none; padding: 6px 12px;
  border-radius: 8px; font-size: 13px; display: flex; align-items: center; gap: 6px;
}
.nav a:hover { background: var(--line-soft); color: var(--text); }
.nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.badge {
  background: var(--accent); color: #fff; font-size: 11px;
  padding: 0 6px; border-radius: 9px; line-height: 17px;
}

.who { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; }
.avatar {
  width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft);
  color: var(--accent); display: grid; place-items: center; font-size: 12px; font-weight: 600;
}
.logout { color: var(--text-3); text-decoration: none; margin-left: 6px; font-size: 12px; }
.logout:hover { color: var(--err); }

/* ---------- 统计 ---------- */
.statbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.stat {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px 16px;
}
.stat-label { font-size: 12px; color: var(--text-3); }
.stat-value { font-size: 24px; font-weight: 600; letter-spacing: -0.5px; margin: 2px 0 1px; }
.stat-value .unit { font-size: 12px; font-weight: 400; color: var(--text-3); margin-left: 3px; }
.stat-hint { font-size: 12px; color: var(--text-3); }

/* ---------- 提示 ---------- */
.flash {
  padding: 10px 14px; border-radius: 8px; margin-bottom: 16px;
  font-size: 13px; border: 1px solid transparent;
}
.flash.ok { background: var(--ok-soft); color: var(--ok); border-color: #cfe9d9; }
.flash.warn { background: var(--warn-soft); color: var(--warn); border-color: #f2dfc0; }
.flash.err { background: var(--err-soft); color: var(--err); border-color: #f5cfcf; }

/* ---------- 面板 ---------- */
.panel {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); overflow: hidden;
}
.panel-head {
  display: flex; align-items: baseline; gap: 12px;
  padding: 16px 20px; border-bottom: 1px solid var(--line-soft);
}
.panel-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
.panel-sub { font-size: 12px; color: var(--text-3); }
.filters { margin-left: auto; display: flex; gap: 8px; }
.filters input, .filters select {
  border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px;
  font-size: 13px; background: var(--surface); color: var(--text);
}

/* ---------- 空态 ---------- */
.empty { padding: 56px 20px; text-align: center; color: var(--text-3); }
.empty-icon {
  width: 44px; height: 44px; margin: 0 auto 12px; border-radius: 50%;
  border: 2px dashed var(--line); position: relative;
}
.empty-icon::after {
  content: ""; position: absolute; left: 12px; right: 12px; top: 21px;
  height: 2px; background: var(--line);
}

/* ---------- 队列卡片 ---------- */
.queue { display: flex; flex-direction: column; }
.qcard { border-bottom: 1px solid var(--line-soft); padding: 16px 20px; }
.qcard:last-child { border-bottom: 0; }
.qcard:hover { background: #fcfcfd; }

.qhead { display: flex; align-items: flex-start; gap: 12px; }
.qpos {
  flex: none; min-width: 32px; height: 24px; border-radius: 6px;
  background: var(--accent-soft); color: var(--accent);
  font-size: 12px; font-weight: 600; display: grid; place-items: center;
}
.qtitle { flex: 1; min-width: 0; }
.qline1 { display: flex; align-items: center; gap: 8px; }
.qline1 strong { font-size: 14px; font-weight: 600; }
.qline2 { font-size: 12px; color: var(--text-3); margin-top: 1px; }
.qtime { text-align: right; font-size: 13px; color: var(--text-2); flex: none; }
.qtime-sub { font-size: 11px; color: var(--text-3); }

.tag {
  font-size: 11px; padding: 1px 7px; border-radius: 5px;
  background: var(--warn-soft); color: var(--warn);
}

.qbody { margin: 12px 0 0 44px; }
.money {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 1px; background: var(--line-soft);
  border: 1px solid var(--line-soft); border-radius: 8px; overflow: hidden;
}
.mcell { background: var(--surface); padding: 9px 12px; }
.mcell.highlight { background: var(--accent-soft); }
.mlabel { display: block; font-size: 11px; color: var(--text-3); }
.mvalue { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
.mcell.highlight .mvalue { color: var(--accent); }

.progress-wrap { margin-top: 12px; }
.progress {
  height: 8px; border-radius: 5px; background: var(--line-soft);
  display: flex; overflow: hidden;
}
.bar.done { background: #34a853; }
.bar.pending { background: #f0b429; }
.progress-legend {
  display: flex; gap: 16px; margin-top: 6px;
  font-size: 11px; color: var(--text-3);
}
.dot {
  display: inline-block; width: 7px; height: 7px; border-radius: 2px;
  margin-right: 4px; vertical-align: 1px;
}
.dot.done { background: #34a853; }
.dot.pending { background: #f0b429; }

.reason { margin-top: 12px; display: flex; gap: 8px; font-size: 13px; }
.rlabel { color: var(--text-3); flex: none; font-size: 12px; line-height: 1.7; }
.rtext { color: var(--text); }

.ship { margin-top: 6px; font-size: 12px; color: var(--text-3); }

.qfoot {
  margin: 14px 0 0 44px; padding-top: 12px;
  border-top: 1px dashed var(--line);
  display: flex; gap: 12px; flex-wrap: wrap;
}
.inline-form { display: flex; gap: 8px; align-items: center; }
.inline-form input {
  border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px;
  font-size: 13px; width: 180px; background: var(--surface); color: var(--text);
}
.inline-form input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

/* ---------- 按钮 ---------- */
.btn {
  border: 1px solid transparent; border-radius: 7px; padding: 6px 14px;
  font-size: 13px; cursor: pointer; font-family: inherit;
  background: var(--surface); color: var(--text);
}
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { background: #1d4ed8; }
.btn.danger { background: var(--err); color: #fff; }
.btn.danger:hover { background: #991b1b; }
.btn.ghost { border-color: var(--line); color: var(--text-2); }
.btn.ghost:hover { background: var(--line-soft); }
.btn.small { padding: 4px 10px; font-size: 12px; }
.btn.block { width: 100%; margin-top: 6px; padding: 9px; }

/* ---------- 表格 ---------- */
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th {
  text-align: left; font-weight: 500; color: var(--text-3); font-size: 12px;
  padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap;
  background: #fbfcfd;
}
.table td { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); }
.table tr:last-child td { border-bottom: 0; }
.table tr:hover td { background: #fcfcfd; }
.table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.table .strong { font-weight: 600; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.mini { font-size: 11px; color: var(--text-3); }
.ellipsis { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reason-cell { max-width: 180px; color: var(--text-2); }
.locked-row td { background: #fffbf5; }

.status {
  font-size: 11px; padding: 2px 8px; border-radius: 5px;
  background: var(--line-soft); color: var(--text-2); white-space: nowrap;
}
.status.pending { background: var(--warn-soft); color: var(--warn); }
.status.approved { background: var(--ok-soft); color: var(--ok); }
.status.rejected { background: var(--err-soft); color: var(--err); }
.status.paid { background: var(--accent-soft); color: var(--accent); }
.status.cancelled, .status.completed { background: var(--line-soft); color: var(--text-2); }
.status.refunded { background: var(--ok-soft); color: var(--ok); }
.status.created { background: #f4f0ff; color: #6d28d9; }

/* ---------- 登录 ---------- */
.login-body {
  min-height: 100vh; display: grid; place-items: center;
  background: var(--bg); margin: 0; padding: 20px;
}
.login-card {
  width: 100%; max-width: 360px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 14px; padding: 28px;
}
.login-card .brand { margin-bottom: 20px; }
.login-card form { display: flex; flex-direction: column; gap: 14px; }
.login-card label { font-size: 13px; color: var(--text-2); display: block; }
.login-card input {
  width: 100%; margin-top: 5px; padding: 9px 12px; font-size: 14px;
  border: 1px solid var(--line); border-radius: 8px; font-family: inherit;
  background: var(--surface); color: var(--text);
}
.login-card input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.hint { text-align: center; font-size: 12px; color: var(--text-3); margin: 16px 0 0; }

@media (max-width: 860px) {
  .statbar { grid-template-columns: repeat(2, 1fr); }
  .money { grid-template-columns: repeat(2, 1fr); }
  .nav { margin-left: 0; }
  .topbar { flex-wrap: wrap; gap: 12px; }
}

/* ==========================================================================
   多页面扩展：审核详情 / 会话观测 / 售后分析 / 审计
   ========================================================================== */

.muted { color: var(--text-3); }
.small { font-size: 12px; }
.link { color: var(--accent); text-decoration: none; }
.link:hover { text-decoration: underline; }
.nowrap { white-space: nowrap; }

/* 顶部统计的告警态 */
.stat.alert { border-color: #f3c2c2; background: var(--err-soft); }
.stat.alert .stat-value { color: var(--err); }

/* 徽标 */
.pill {
  display: inline-block; padding: 1px 8px; border-radius: 999px;
  font-size: 11px; border: 1px solid var(--line); color: var(--text-2);
  background: var(--line-soft); white-space: nowrap;
}
.pill.tiny { font-size: 10px; padding: 0 6px; }
.pill.risk.low { color: var(--ok); background: var(--ok-soft); border-color: #bfe3cc; }
.pill.risk.medium { color: var(--warn); background: var(--warn-soft); border-color: #ecd6b4; }
.pill.risk.high { color: var(--err); background: var(--err-soft); border-color: #f0c0c0; }
.pill.prio { color: var(--text-2); font-weight: 600; letter-spacing: .02em; }
.pill.warn { color: var(--warn); background: var(--warn-soft); border-color: #ecd6b4; }
.pill.web { color: #6d28d9; background: #f3eeff; border-color: #ddd0fb; }
.pill.cli { color: #0f766e; background: #e6f7f5; border-color: #bde6e1; }
.pill.sys { color: var(--text-2); }

/* 卡片 */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px;
}
.card h3 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--text); }
.card h4 { margin: 16px 0 8px; font-size: 12px; font-weight: 600; color: var(--text-2); }

/* 分段切换 */
.seg { margin-left: auto; display: flex; gap: 2px; background: var(--line-soft);
       padding: 2px; border-radius: 8px; }
.seg-item {
  padding: 4px 12px; border-radius: 6px; font-size: 12px;
  color: var(--text-2); text-decoration: none;
}
.seg-item.on { background: var(--surface); color: var(--text); font-weight: 500;
               box-shadow: 0 1px 2px rgba(0,0,0,.06); }

/* KPI 组 */
.kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
.kpis-sm { grid-template-columns: repeat(6, 1fr); }
.kpi {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 12px 14px;
}
.kpi.alert { border-color: #f3c2c2; background: var(--err-soft); }
.k-label { font-size: 12px; color: var(--text-3); }
.k-value { font-size: 20px; font-weight: 600; letter-spacing: -.01em; margin-top: 2px; }
.k-value .unit { font-size: 12px; font-weight: 400; color: var(--text-3); margin-left: 2px; }
.k-hint { font-size: 11px; color: var(--text-3); margin-top: 2px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* 商品排行 */
.rank { list-style: none; margin: 0; padding: 0; }
.rank li { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line-soft); }
.rank li:last-child { border-bottom: 0; }
.rk { width: 20px; height: 20px; flex: none; border-radius: 6px; background: var(--line-soft);
      color: var(--text-2); font-size: 11px; display: flex; align-items: center;
      justify-content: center; font-weight: 600; margin-top: 2px; }
.rank li:first-child .rk { background: var(--accent-soft); color: var(--accent); }
.rk-body { flex: 1; min-width: 0; }
.rk-top { display: flex; justify-content: space-between; gap: 10px; }
.rk-name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rk-amt { font-size: 13px; font-weight: 600; flex: none; }
.rk-bar { height: 5px; background: var(--line-soft); border-radius: 3px; margin: 5px 0 3px; overflow: hidden; }
.rk-fill { height: 100%; background: linear-gradient(90deg, #93b4f7, var(--accent)); border-radius: 3px; }
.rk-meta { font-size: 11px; color: var(--text-3); }

/* 原因分布 */
.dist { list-style: none; margin: 0; padding: 0; }
.dist li { display: grid; grid-template-columns: 84px 1fr auto; gap: 10px;
           align-items: center; padding: 6px 0; }
.d-label { font-size: 12px; color: var(--text-2); }
.d-bar { height: 8px; background: var(--line-soft); border-radius: 4px; overflow: hidden; }
.d-fill { height: 100%; background: #f0a868; border-radius: 4px; }
.d-val { font-size: 11px; color: var(--text-3); white-space: nowrap; }

/* 趋势柱 */
.trend { display: flex; align-items: flex-end; gap: 4px; height: 130px; padding-top: 8px; }
.t-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
         align-items: center; height: 100%; }
.t-bar { width: 100%; max-width: 26px; background: var(--accent-soft);
         border-radius: 3px 3px 0 0; min-height: 2px;
         background: linear-gradient(180deg, #6f9bf0, #c7d8fb); }
.t-label { font-size: 10px; color: var(--text-3); height: 14px; }

/* 表格 */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th {
  text-align: left; font-weight: 500; color: var(--text-3); font-size: 12px;
  padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap;
}
.tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.current { background: var(--accent-soft); }
.tbl tr.row-err { background: #fffafa; }
.cell-text { max-width: 460px; word-break: break-word; }
pre.json {
  margin: 6px 0 0; padding: 10px; background: #1f2328; color: #e6edf3;
  border-radius: 8px; font-size: 11px; line-height: 1.5; max-width: 520px;
  max-height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-all;
}
summary.mini { cursor: pointer; color: var(--accent); font-size: 11px; }
.filterbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.filterbar select {
  padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); font-size: 12px; color: var(--text);
}

/* 键值列表 */
.kv { display: grid; grid-template-columns: 92px 1fr; gap: 6px 12px; margin: 0; }
.kv dt { color: var(--text-3); font-size: 12px; }
.kv dd { margin: 0; font-size: 13px; }

/* 审核详情布局 */
.review-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
               gap: 14px; align-items: start; }
.review-side .card { margin-bottom: 14px; }
.decision-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.score { margin-left: auto; font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
.score small { font-size: 11px; font-weight: 400; color: var(--text-3); }
.decision-summary { margin: 0 0 12px; font-size: 13px; color: var(--text); }
.amount-box { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; }
.ab-label { font-size: 11px; color: var(--accent); font-weight: 600; margin-bottom: 2px; }
.ab-value { font-size: 12px; color: var(--text); }
.rulelist { list-style: none; margin: 0; padding: 0; }
.rulelist li {
  display: grid; grid-template-columns: 34px 1fr; gap: 4px 8px;
  padding: 7px 0; border-bottom: 1px dashed var(--line-soft); font-size: 12px;
}
.rulelist li:last-child { border-bottom: 0; }
.rdelta { font-weight: 600; font-size: 12px; text-align: right; }
.rdelta.up { color: var(--err); }
.rdelta.down { color: var(--ok); }
.rname { font-weight: 500; }
.rdetail { grid-column: 2; color: var(--text-3); font-size: 11px; }
.lockbox {
  margin-top: 12px; padding: 9px 11px; border-radius: 8px; font-size: 12px;
  background: var(--warn-soft); color: var(--warn); border: 1px solid #ecd6b4;
}
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: flex; gap: 9px; padding-bottom: 12px; position: relative; }
.timeline li:not(:last-child)::before {
  content: ""; position: absolute; left: 4px; top: 14px; bottom: 0;
  width: 1px; background: var(--line);
}
.t-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent);
         margin-top: 5px; flex: none; }
.t-title { font-size: 12px; font-weight: 500; }
.t-meta { font-size: 11px; color: var(--text-3); }
.t-note { font-size: 12px; color: var(--text-2); }
.stack { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.btn.block { width: 100%; justify-content: center; }
.decision-line {
  display: flex; gap: 10px; align-items: baseline; padding: 7px 10px;
  background: var(--accent-soft); border-radius: 7px; margin: 8px 0;
}
.status.sb-pending, .tag.sb-pending { color: var(--warn); }
.tag.sb-approved { color: var(--ok); }
.tag.sb-rejected { color: var(--err); }
.qcard.risk-high { box-shadow: inset 3px 0 0 var(--err); }
.qcard.risk-medium { box-shadow: inset 3px 0 0 #e9a23b; }

/* 会话页 */
.chat-layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 14px;
               align-items: start; }
.chat-aside { background: var(--surface); border: 1px solid var(--line);
              border-radius: var(--radius); padding: 12px; }
.aside-head { display: flex; align-items: center; justify-content: space-between;
              font-size: 12px; color: var(--text-3); margin-bottom: 8px; }
.sesslist { list-style: none; margin: 0; padding: 0; max-height: 620px; overflow: auto; }
.sesslist li { border-radius: 8px; margin-bottom: 2px; }
.sesslist li.on { background: var(--accent-soft); }
.sesslist a { display: block; padding: 8px 9px; text-decoration: none; color: inherit; }
.sesslist a:hover { background: var(--line-soft); border-radius: 8px; }
.sl-title { font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; }
.sl-meta { font-size: 11px; color: var(--text-3); display: flex; gap: 6px;
           align-items: center; margin-top: 2px; }
.sl-time { font-size: 10px; color: var(--text-3); }
